<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditor de Catálogo v2.3 - Pamesa (Auto-Carga)</title>
    
    <!-- FUENTES CORPORATIVAS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- LIBRERÍAS EXTERNAS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* ========================================= */
        /* SISTEMA DE DISEÑO PAMESA (Refinado)       */
        /* ========================================= */
        :root {
            --color-principal: #ce1719;
            --color-principal-hover: #b51517;
            --color-secundario: #4b5563;
            --color-fondo: #f3f4f6;
            --color-blanco: #ffffff;
            --color-texto-principal: #1f2937;
            --color-texto-secundario: #6b7280;
            --color-borde-suave: #e5e7eb;
            
            --radio-borde: 12px;
            --sombra-card: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
            --sombra-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --sombra-modal: 0 25px 50px -12px rgba(0, 0, 0, 0.25);

            --font-main: 'Montserrat', sans-serif;
            --font-tech: 'Montserrat', sans-serif;
        }

        /* RESET & BASE */
        * { box-sizing: border-box; outline: none; }
        body { 
            font-family: var(--font-main); 
            background-color: var(--color-fondo); 
            color: var(--color-texto-principal);
            height: 100vh; 
            overflow: hidden; 
            margin: 0; 
            -webkit-font-smoothing: antialiased;
        }
        
        #app-container { display: flex; height: 100vh; width: 100vw; overflow: hidden; }

        /* COMPONENTES UI */
        .panel {
            background-color: var(--color-blanco);
            border-radius: var(--radio-borde);
            box-shadow: var(--sombra-card);
            border: 1px solid transparent; 
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            overflow: hidden;
            display: flex; flex-direction: column;
        }
        
        /* BOTONES */
        .btn-accion {
            background-color: var(--color-principal); 
            color: white; 
            border: none;
            padding: 10px 20px; 
            border-radius: 8px;
            cursor: pointer; 
            font-weight: 600; 
            font-size: 0.85em;
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            gap: 8px;
            transition: all 0.2s; 
            box-shadow: 0 2px 4px rgba(206, 23, 25, 0.3);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .btn-accion:hover { 
            background-color: var(--color-principal-hover); 
            transform: translateY(-2px); 
            box-shadow: 0 4px 10px rgba(206, 23, 25, 0.4); 
        }
        .btn-accion.secundario { 
            background-color: #fff; 
            color: var(--color-texto-principal);
            border: 1px solid var(--color-borde-suave);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .btn-accion.secundario:hover {
            background-color: #f9fafb; 
            border-color: #d1d5db;
            color: var(--color-principal);
        }

        /* SCROLLBAR PERSONALIZADO */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }

        /* PANTALLA DE CARGA (Oculta por CSS base para auto-carga) */
        #upload-overlay { 
            position: fixed; inset: 0; 
            background-color: rgba(243, 244, 246, 0.85); 
            backdrop-filter: blur(5px); 
            z-index: 100; 
            display: none; /* OCULTO POR DEFECTO PARA AUTO-CARGA */
            align-items: center; justify-content: center; flex-direction: column; 
        }
        
        /* SIDEBAR */
        #sidebar { 
            width: 340px; 
            background: var(--color-blanco); 
            color: var(--color-texto-principal); 
            display: flex; flex-direction: column; flex-shrink: 0; 
            border-right: 1px solid var(--color-borde-suave);
            z-index: 20;
            box-shadow: 4px 0 24px rgba(0,0,0,0.03);
        }
        
        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--color-borde-suave);
            background-color: #fff;
            flex-shrink: 0;
        }

        .search-container { position: relative; margin-top: 16px; }
        .search-input {
            width: 100%; padding: 10px 16px 10px 40px; border-radius: 8px;
            border: 1px solid var(--color-borde-suave); background-color: #f9fafb;
            font-size: 0.9em; transition: all 0.2s; color: var(--color-texto-principal);
        }
        .search-input:focus {
            background-color: #fff; border-color: var(--color-principal);
            box-shadow: 0 0 0 3px rgba(206, 23, 25, 0.1);
        }

        /* ACORDEÓN SIDEBAR */
        .collection-group { border-bottom: 1px solid #f1f5f9; }
        
        .collection-header { 
            padding: 14px 20px; 
            background-color: #f8fafc; 
            cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            transition: background-color 0.2s;
            user-select: none;
        }
        .collection-header:hover { background-color: #f1f5f9; }
        
        .collection-title { 
            font-size: 0.75rem; font-weight: 700; 
            text-transform: uppercase; color: #334155; 
            letter-spacing: 0.05em; 
            display: flex; align-items: center; gap: 8px;
        }
        
        .collection-meta { display: flex; align-items: center; gap: 10px; }
        
        .series-count-badge {
            background-color: #e2e8f0; color: #64748b;
            font-size: 0.7rem; font-weight: 600;
            padding: 2px 8px; border-radius: 12px;
            min-width: 24px; text-align: center;
        }
        
        .chevron-icon { 
            color: #94a3b8; width: 16px; height: 16px; 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .chevron-icon.rotated { transform: rotate(90deg); }

        .series-container {
            display: none; 
            background-color: #ffffff;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .series-container.expanded { display: block; animation: slideDown 0.2s ease-out; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-item { 
            cursor: pointer; padding: 10px 20px 10px 44px; 
            font-size: 0.85rem; font-weight: 500; color: #475569;
            display: flex; justify-content: space-between; align-items: center; 
            transition: all 0.15s;
            border-left: 3px solid transparent;
        }
        .nav-item:hover { background-color: #f8fafc; color: var(--color-principal); border-left-color: #cbd5e1; }
        .nav-item.active { 
            background-color: #fef2f2; 
            color: var(--color-principal); font-weight: 600; 
            border-left-color: var(--color-principal);
        }
        .nav-item.hidden-item { display: none !important; }

        /* CONTENIDO PRINCIPAL */
        #main-content { 
            flex: 1; display: flex; flex-direction: column; 
            background: var(--color-fondo); overflow: hidden; position: relative;
        }

        #inner-scroll {
            flex: 1; overflow-y: auto; 
            padding: 32px; scroll-behavior: smooth;
        }

        /* TARJETAS DE CABECERA */
        .info-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; margin-top: 20px;
        }
        .info-card { 
            background: #f9fafb; padding: 16px; 
            border-radius: 8px; border: 1px solid rgba(0,0,0,0.04); 
            display: flex; flex-direction: column; justify-content: center;
            text-align: center;
        }
        .info-label { font-size: 0.7rem; color: var(--color-texto-secundario); text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; margin-bottom: 6px; }
        .info-val { font-weight: 600; color: var(--color-texto-principal); font-size: 0.95rem; font-family: var(--font-main); }

        /* TABLA REFINADA */
        .table-container {
            background: white; border-radius: var(--radio-borde);
            box-shadow: var(--sombra-card); border: 1px solid var(--color-borde-suave);
            overflow: hidden; margin-bottom: 30px;
        }
        
        .audit-table { width: 100%; border-collapse: separate; border-spacing: 0; }
        
        .audit-table th { 
            background: #fff; text-align: left; padding: 16px; 
            border-bottom: 2px solid var(--color-borde-suave); 
            font-size: 0.75rem; font-weight: 700;
            text-transform: uppercase; color: var(--color-texto-secundario); 
            position: sticky; top: 0; z-index: 10; letter-spacing: 0.05em;
        }

        .audit-table td { 
            padding: 16px; border-bottom: 1px solid var(--color-borde-suave); 
            vertical-align: middle; color: var(--color-texto-principal); background: white;
        }
        
        /* Estados de Fila */
        .row-base { transition: background 0.2s; }
        .row-base:hover td { background-color: #f9fafb; }
        
        .row-error td { background-color: #fff1f2 !important; } 
        .row-error td:first-child { box-shadow: inset 4px 0 0 var(--color-principal); } 
        
        .row-ok td { background-color: #f0fdf4 !important; } 
        .row-ok td:first-child { box-shadow: inset 4px 0 0 #22c55e; }

        /* Separador de formato */
        .row-separator td {
            background-color: #f3f4f6; 
            border-top: 1px solid #d1d5db;
            border-bottom: 1px solid #e5e7eb;
            padding: 12px 16px;
        }
        .separator-content {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.85em; font-weight: 700; color: #374151; text-transform: uppercase;
        }

        /* Imágenes */
        .thumb-container { 
            width: 64px; height: 64px; background: #f3f4f6; 
            border-radius: 8px; border: 1px solid var(--color-borde-suave);
            display: flex; align-items: center; justify-content: center; 
            overflow: hidden; position: relative; transition: transform 0.2s;
            cursor: zoom-in;
        }
        .thumb-container:hover { transform: scale(1.05); box-shadow: var(--sombra-hover); border-color: var(--color-principal); }
        .thumb-img { width: 100%; height: 100%; object-fit: cover; }

        /* Badges */
        .badge-20mm {
            background-color: #1f2937; color: #fbbf24;
            padding: 4px 10px; border-radius: 6px;
            font-size: 0.75rem; font-weight: 700; letter-spacing: 0.05em;
            border: 1px solid #fbbf24; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: inline-flex; align-items: center; gap: 5px;
        }
        
        .tech-pill {
            display: inline-flex; align-items: center;
            font-family: var(--font-tech); font-size: 0.75rem;
            padding: 2px 8px; border-radius: 6px;
            background: white; border: 1px solid var(--color-borde-suave);
            color: var(--color-secundario); font-weight: 600;
            margin-right: 4px; margin-bottom: 4px;
        }
        .tech-pill.high { background: #fff7ed; color: #c2410c; border-color: #fdba74; }
        
        .font-tech { font-family: var(--font-tech); }
        .text-label { color: var(--color-texto-secundario); font-size: 0.7em; font-weight: 700; text-transform: uppercase; margin-right: 6px; }

        /* ========================================= */
        /* ESTILOS DEL MODAL (NUEVO)                 */
        /* ========================================= */
        .modal-overlay {
            position: fixed; inset: 0; background-color: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px);
            z-index: 100; display: none; justify-content: center; align-items: center; padding: 20px;
            animation: fadeIn 0.2s ease-out;
        }
        .modal-overlay.visible { display: flex; }
        
        .modal-content {
            background: white; width: 100%; max-width: 1000px; max-height: 90vh;
            border-radius: var(--radio-borde); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            display: flex; flex-direction: column; overflow: hidden;
            animation: scaleUp 0.2s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleUp { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .modal-header {
            padding: 20px; border-bottom: 1px solid var(--color-borde-suave);
            display: flex; justify-content: space-between; align-items: center;
            background: #fff;
        }
        .modal-body {
            flex: 1; overflow-y: auto; padding: 24px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 30px;
        }
        .modal-img-wrapper {
            background: #f9fafb; border-radius: 8px; display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--color-borde-suave); height: 100%; min-height: 400px;
        }
        .modal-img { max-width: 100%; max-height: 500px; object-fit: contain; }
        
        .modal-details-section h4 {
            font-size: 0.85rem; font-weight: 700; text-transform: uppercase; 
            color: #94a3b8; margin-bottom: 12px; letter-spacing: 0.05em; border-bottom: 1px solid #f1f5f9; padding-bottom: 4px;
        }
        .detail-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; }
        .detail-row span:first-child { color: #64748b; font-weight: 500; }
        .detail-row span:last-child { color: #1e293b; font-weight: 700; font-family: var(--font-tech); text-align: right; }

        @media (max-width: 768px) {
            .modal-body { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- 1. PANTALLA DE CARGA (OCULTA PARA MODO AUTO) -->
    <div id="upload-overlay" style="display:none;">
        <div class="drop-zone" id="drop-zone">
            <h1 class="text-2xl font-bold mb-2 text-gray-900 tracking-tight">Cargando datos...</h1>
            <div id="loading-msg" class="mt-4 flex flex-col items-center">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-red-600 mb-3"></div>
            </div>
        </div>
    </div>

    <!-- 2. INTERFAZ PRINCIPAL -->
    <div id="app-container" class="hidden">
        
        <!-- BARRA LATERAL MEJORADA -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <div class="flex items-center gap-3 mb-4">
                    <img src="LOGO-PAMESA.jpg" alt="Pamesa" class="h-8 w-auto object-contain">
                    <div class="h-4 w-px bg-gray-300"></div>
                    <span class="font-bold text-sm text-gray-500 tracking-wide">AUDITOR v2.3</span>
                </div>
                <div class="search-container">
                    <i data-lucide="search" class="absolute left-3 top-3 text-gray-400 w-4 h-4"></i>
                    <input type="text" id="global-search" placeholder="Buscar serie..." class="search-input">
                </div>
            </div>
            
            <!-- ÁRBOL DE NAVEGACIÓN (Acordeón) -->
            <div id="nav-tree" class="flex-1 overflow-y-auto custom-scrollbar">
                <!-- JS Rellena esto -->
            </div>

            <div class="p-6 border-t border-gray-200 bg-gray-50">
                <div class="flex justify-between text-xs text-gray-500 mb-2 font-mono font-bold">
                    <span>PROGRESO</span>
                    <span id="progress-text" class="text-gray-900">0%</span>
                </div>
                <div class="w-full bg-gray-200 h-2 rounded-full overflow-hidden mb-4">
                    <div id="progress-bar" class="bg-green-500 h-full transition-all duration-500 shadow-sm" style="width: 0%"></div>
                </div>
                <button id="btn-export-errors" class="btn-accion secundario w-full justify-center">
                    <i data-lucide="download" class="w-4 h-4"></i> Exportar Informe
                </button>
            </div>
        </aside>

        <!-- CONTENIDO -->
        <main id="main-content">
            <div id="inner-scroll" class="custom-scrollbar">
                
                <!-- ESTADO VACÍO -->
                <div id="empty-state" class="flex flex-col items-center justify-center h-full text-gray-400 opacity-60 mt-10">
                    <div class="w-24 h-24 bg-gray-200 rounded-full flex items-center justify-center mb-6">
                        <i data-lucide="layout-dashboard" class="w-10 h-10 text-gray-400"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-600 mb-2">Panel de Auditoría</h2>
                    <p class="text-center text-gray-500 max-w-md">Selecciona una colección y serie del menú izquierdo para comenzar la validación de datos.</p>
                </div>
                
                <div id="serie-content"></div>
            </div>
        </main>
    </div>

    <!-- 3. MODAL DE DETALLE -->
    <div id="article-modal" class="modal-overlay">
        <div class="modal-content">
            <!-- JS RELLENA ESTO -->
        </div>
    </div>

    <script>
    // --- 1. CONFIGURACIÓN Y ESTADO ---
    const CONFIG = {
        csvFileName: './BD-21-11-2025.csv', // NOMBRE DEL FICHERO EN LA RAÍZ
        encoding: 'ISO-8859-1'
    };

    const APP_STATE = {
        data: [],
        hierarchy: {},
        auditResults: JSON.parse(localStorage.getItem('audit_results_v1')) || {}, 
        currentSerie: null
    };

    const COLS = {
        COLECCION: 'Coleccion_web',
        SERIE: 'Serie_web',
        TIPOLOGIA: 'Desc._Familia_web',
        EFECTO: 'Efecto_web',
        USO: 'Tipo_de_uso',
        ACABADO_SERIE: 'Acabado_pieza_web', 
        VARIACION: 'Variacion_cromatica',
        AREA: 'area',

        ID: 'Id._Articulo',
        IMAGEN: 'Imagen_web',
        NOMBRE: 'Nombre',
        COLOR: 'Color_ok',
        MEDIDA: 'Medida',
        ESPESOR: 'Espesor_mm',          
        ACABADO_ART: 'Acabado_pieza_web', 
        GRUPO_PRECIO: 'Grupo_Tarifa',
        GRAFICAS: 'Graficas', 
        PEI: 'UNE-EN_ISO_10545-7',

        CLASE: 'UNE_41901:2017_EX',
        R: 'Deslizamiento_DIN_51130',
        LETRA: 'DIN_51097',
        PTV: 'PTV_(WET)',

        PZ_CAJA: 'Pz/Caja',
        M2_CAJA: 'M2/Caja',
        KG_CAJA: 'Kg/Caja',
        CJ_PALLET: 'Cj/Pallet',
        M2_PALLET: 'M2/Pallet',
        KG_PALLET: 'Kg/Pallet'
    };

    // --- 2. INICIO AUTOMÁTICO (AUTO-LOAD) ---
    document.addEventListener('DOMContentLoaded', () => {
        autoLoadCSV();
    });

    function autoLoadCSV() {
        const loading = document.getElementById('loading-msg');
        if(loading) loading.classList.remove('hidden');

        fetch(CONFIG.csvFileName)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`No se encontró el archivo ${CONFIG.csvFileName}`);
                }
                return response.arrayBuffer(); 
            })
            .then(buffer => {
                const decoder = new TextDecoder(CONFIG.encoding);
                const csvText = decoder.decode(buffer);
                parseCSVContent(csvText);
            })
            .catch(error => {
                console.error("Error cargando CSV:", error);
                alert(`❌ ERROR CRÍTICO:\nNo se pudo cargar el archivo "${CONFIG.csvFileName}".\n\nAsegúrate de que el archivo está en la carpeta raíz del repositorio y que estás accediendo vía HTTP/HTTPS (no file://).`);
                // Si falla, mostramos el overlay para feedback visual
                document.getElementById('upload-overlay').style.display = 'flex';
            });
    }

    function parseCSVContent(csvContent) {
        Papa.parse(csvContent, {
            header: true,
            delimiter: ";",
            skipEmptyLines: true,
            complete: function(results) {
                const fields = results.meta.fields || [];
                if (!fields.includes(COLS.ID) || !fields.includes(COLS.SERIE)) {
                    alert("❌ ERROR DE FORMATO:\nEl CSV cargado no tiene las columnas requeridas ('Id._Articulo', 'Serie_web').");
                    return;
                }
                APP_STATE.data = results.data;
                buildHierarchy();
                initInterface();
            },
            error: function(err) {
                alert("Error al procesar datos CSV: " + err.message);
            }
        });
    }

    // --- 3. UTILIDADES ---
    function safeVal(value) {
        if (value === null || value === undefined) return "";
        return String(value).trim();
    }

    function hasValue(value) {
        return value !== null && value !== undefined && String(value).trim() !== "";
    }

    function renderField(value, label, isPrice = false) {
        const val = safeVal(value);
        if (!val) {
            return `<span class="text-red-600 text-[10px] font-bold bg-red-50 px-2 py-1 rounded border border-red-100 flex items-center gap-1 w-fit">⚠️ ${label}</span>`;
        }
        if (isPrice) return `<span class="font-tech font-bold text-gray-900 text-base tracking-tight">${val}</span>`;
        return `<span class="text-gray-700 font-medium">${val}</span>`;
    }

    function buildHierarchy() {
        const tree = {};
        APP_STATE.data.forEach(row => {
            if (!safeVal(row[COLS.ID]) && !safeVal(row[COLS.SERIE])) return;
            let coll = safeVal(row[COLS.COLECCION]) || 'SIN COLECCIÓN';
            let serie = safeVal(row[COLS.SERIE]) || 'SIN SERIE';
            if (!tree[coll]) tree[coll] = {};
            if (!tree[coll][serie]) tree[coll][serie] = [];
            tree[coll][serie].push(row);
        });
        APP_STATE.hierarchy = tree;
    }

    // --- 4. INTERFAZ DE USUARIO ---
    function initInterface() {
        const overlay = document.getElementById('upload-overlay');
        if(overlay) overlay.style.display = 'none';
        
        document.getElementById('app-container').classList.remove('hidden');
        renderSidebar();
        updateGlobalProgress();
        if(window.lucide) lucide.createIcons();
    }

    // ============================================================
    // FUNCIONALIDAD ACORDEÓN
    // ============================================================
    function renderSidebar() {
        const nav = document.getElementById('nav-tree');
        nav.innerHTML = '';
        
        Object.keys(APP_STATE.hierarchy).sort().forEach((coll, index) => {
            const cleanCollName = coll.toLowerCase();
            const seriesList = Object.keys(APP_STATE.hierarchy[coll]).sort();
            const seriesCount = seriesList.length;

            const collectionGroup = document.createElement('div');
            collectionGroup.className = 'collection-group';
            collectionGroup.dataset.coll = cleanCollName;

            const header = document.createElement('div');
            header.className = 'collection-header';
            header.innerHTML = `
                <div class="collection-title">
                    <i data-lucide="folder" style="width:14px; height:14px; color:#cbd5e1;"></i>
                    ${coll}
                </div>
                <div class="collection-meta">
                    <span class="series-count-badge">${seriesCount}</span>
                    <i data-lucide="chevron-right" class="chevron-icon"></i>
                </div>
            `;

            const seriesContainer = document.createElement('div');
            seriesContainer.className = 'series-container';
            seriesContainer.id = `series-container-${index}`;

            header.addEventListener('click', () => {
                const isClosed = seriesContainer.style.display === 'none' || seriesContainer.style.display === '';
                if (isClosed) {
                    seriesContainer.style.display = 'block';
                    header.querySelector('.chevron-icon').classList.add('rotated');
                    seriesContainer.classList.add('expanded');
                } else {
                    seriesContainer.style.display = 'none';
                    header.querySelector('.chevron-icon').classList.remove('rotated');
                    seriesContainer.classList.remove('expanded');
                }
            });

            seriesList.forEach(serie => {
                const div = document.createElement('div');
                div.className = 'nav-item';
                div.dataset.serie = serie.toLowerCase();
                div.dataset.coll = cleanCollName;
                div.innerHTML = `<span>${serie}</span> ${getStatusDot(serie, coll)}`;
                div.onclick = () => {
                    document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
                    div.classList.add('active');
                    loadSerieView(serie, coll);
                };
                seriesContainer.appendChild(div);
            });

            collectionGroup.appendChild(header);
            collectionGroup.appendChild(seriesContainer);
            nav.appendChild(collectionGroup);
        });
    }

    function getStatusDot(serie, coll) {
        const rows = APP_STATE.hierarchy[coll][serie];
        let err = 0, ok = 0;
        rows.forEach(r => {
            const status = APP_STATE.auditResults[r[COLS.ID]]?.status;
            if(status === 'error') err++;
            if(status === 'ok') ok++;
        });
        if(err > 0) return `<div class="w-2 h-2 rounded-full bg-red-500 shadow-sm"></div>`;
        if(ok === rows.length && rows.length > 0) return `<div class="w-2 h-2 rounded-full bg-green-500 shadow-sm"></div>`;
        return '';
    }

    // --- 5. RENDERIZADO DE SERIE ---
    function loadSerieView(serieName, collName) {
        document.getElementById('empty-state').style.display = 'none';
        APP_STATE.currentSerie = { name: serieName, coll: collName };
        const rows = APP_STATE.hierarchy[collName][serieName];
        const container = document.getElementById('serie-content');
        
        const first = rows[0];
        const finishesSet = new Set();
        const usosSet = new Set(); 
        const tiposSet = new Set();
        let has20MM = false;

        rows.forEach(r => {
            const baseFinish = safeVal(r[COLS.ACABADO_SERIE]);
            if(baseFinish) finishesSet.add(baseFinish);
            const name = safeVal(r[COLS.NOMBRE]).toUpperCase();
            if(name.includes("EXT")) finishesSet.add("EXT");
            if(name.includes("DUP")) finishesSet.add("DUP");
            if(safeVal(r[COLS.ESPESOR]).startsWith("20")) has20MM = true;
            
            const usoItem = safeVal(r[COLS.USO]);
            if(usoItem) usosSet.add(usoItem);
            const tipoItem = safeVal(r[COLS.TIPOLOGIA]);
            if(tipoItem) tiposSet.add(tipoItem);
        });
        const finishesStr = Array.from(finishesSet).join(', ');
        const usosStr = Array.from(usosSet).join(', ');
        const tiposStr = Array.from(tiposSet).join(', ');
        
        const uniqueMeasures = new Map();
        rows.forEach(r => {
            const label = safeVal(r[COLS.MEDIDA]);
            if (!label) return;
            if (!uniqueMeasures.has(label)) {
                const areaVal = parseFloat(safeVal(r[COLS.AREA]).replace(',', '.') || 0);
                uniqueMeasures.set(label, areaVal);
            }
        });
        const measuresStr = Array.from(uniqueMeasures.entries())
            .sort((a, b) => b[1] - a[1])
            .map(entry => entry[0])
            .join(', ');

        let html = `
        <div class="panel p-6 mb-8 relative overflow-hidden">

                        <h2 class="text-3xl font-bold text-gray-900 flex items-center gap-3">
                            ${serieName}

                    </div>
                </div>
                
                <div class="info-grid">

                    </div>
                    <div class="info-card">
                        <div class="info-label">Efecto</div>
                        <div class="info-val">${renderField(first[COLS.EFECTO], 'EFECTO')}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Acabados</div>
                        <div class="info-val">${finishesStr || '<span class="text-gray-400">-</span>'}</div>
                    </div>
                    <div class="info-card">
                        <div class="info-label">Uso</div>
                        <div class="info-val text-sm">${usosStr || '<span class="text-gray-400">-</span>'}</div>

                </div>

        </div>

        html += `
        <div class="panel mb-8">
            <div class="px-6 py-4 border-b border-gray-100 bg-white flex justify-between items-center">
                <h3 class="font-bold text-gray-800 flex items-center gap-2">
                    <i data-lucide="list" class="w-4 h-4 text-gray-400"></i> Listado de Artículos

                        </tr>
                    </thead>
                    <tbody>
        `;

        const getGroupLabel = (r) => {
            const medida = safeVal(r[COLS.MEDIDA]);
            const espesor = safeVal(r[COLS.ESPESOR]).toUpperCase();
            const nombre = safeVal(r[COLS.NOMBRE]).toUpperCase();
            if (espesor.startsWith('20') || nombre.includes('20MM')) return `${medida} [20MM]`;
            if (nombre.includes('EXT') || nombre.includes('DUP')) return `${medida} [EXT]`;
            return medida;
        };

        rows.sort((a,b) => {
            const areaA = parseFloat(safeVal(a[COLS.AREA]).replace(',', '.') || 0);
            const areaB = parseFloat(safeVal(b[COLS.AREA]).replace(',', '.') || 0);
            if (areaB !== areaA) return areaB - areaA;
            const labelA = getGroupLabel(a);
            const labelB = getGroupLabel(b);
            if (labelA !== labelB) return labelA.localeCompare(labelB);
            return (a[COLS.NOMBRE]||'').localeCompare(b[COLS.NOMBRE]||'');

        let lastLabel = null;

        rows.forEach(row => {
            const id = row[COLS.ID];
            const currentLabel = getGroupLabel(row); 

            if (currentLabel !== lastLabel) {
                let sepIcon = 'ruler';
                let sepClass = 'text-gray-400';
                let sepTextClass = 'text-gray-700';

                if(currentLabel.includes('[20MM]')) {

                    sepClass = 'text-orange-500';
                    sepTextClass = 'text-orange-800 bg-orange-50 px-2 py-1 rounded';

                    sepIcon = 'sun';
                    sepClass = 'text-blue-500';
                    sepTextClass = 'text-blue-800 bg-blue-50 px-2 py-1 rounded';
                }

                html += `
                    <tr class="row-separator">
                        <td colspan="7">

                            </div>

                    </tr>
                `;
                lastLabel = currentLabel;
            }

            const res = APP_STATE.auditResults[id] || {};
            let rowClass = 'row-base';
            let iconName = 'circle';
            let iconColor = 'text-gray-300';

            html += `

                    <td>

                    </td>
                    <td>
                        <div class="font-bold text-gray-800 text-sm mb-1">${renderField(row[COLS.NOMBRE], 'NOMBRE')}</div>

                    </td>
                    <td>
                        <div class="text-xs space-y-1">
                            <div><span class="text-label">COLOR</span> ${renderField(row[COLS.COLOR], 'COLOR')}</div>
                            <div><span class="text-label">ACABADO</span> <span class="font-bold text-blue-600 uppercase text-[11px]">${renderField(row[COLS.ACABADO_ART], 'ACABADO')}</span></div>
                            <div><span class="text-label">ESP</span> <span class="font-tech text-gray-600">${renderField(row[COLS.ESPESOR], 'ESP')}</span></div>
                        </div>
                    </td>
                    <td>
                        <div class="text-xs">
                            <div class="mb-2 flex items-center gap-1">
                                <span class="text-label">GRÁFICAS</span> 
                                <span class="font-bold text-gray-700 bg-gray-100 px-2 py-0.5 rounded font-tech">${safeVal(row[COLS.GRAFICAS]) || '-'}</span>
                            </div>
                            
                            <div class="flex flex-wrap max-w-[220px]">
                                ${hasValue(row[COLS.PEI]) ? `<span class="tech-pill text-blue-600 bg-blue-50 border-blue-100">PEI ${row[COLS.PEI]}</span>` : ''}
                                ${techClase ? `<span class="tech-pill ${['2','3'].some(x => techClase.includes(x)) ? 'high' : ''}">CTE ${techClase}</span>` : ''}
                                ${techR ? `<span class="tech-pill ${['10','11','12','13'].some(x => techR.includes(x)) ? 'high' : ''}">R${techR.replace(/R/i,'')}</span>` : ''}
                                ${techDin ? `<span class="tech-pill ${['B','C'].some(x => techDin.includes(x)) ? 'high' : ''}">DIN ${techDin}</span>` : ''}
                                ${techPtv ? `<span class="tech-pill">PTV ${techPtv}</span>` : ''}
                            </div>
                        </div>
                    </td>
                    <td class="text-right">
                        ${renderField(row[COLS.GRUPO_PRECIO], '€', true)}
                    </td>
                    <td class="text-right">
                        <div class="flex justify-end gap-2">
                            <button onclick="setStatus('${id}', 'ok')" class="w-8 h-8 flex items-center justify-center hover:bg-green-100 rounded-full text-green-600 transition" title="Correcto">
                                <i data-lucide="check" class="w-4 h-4"></i>
                            </button>
                            <button onclick="reportError('${id}')" class="w-8 h-8 flex items-center justify-center hover:bg-red-100 rounded-full text-red-600 transition" title="Reportar Error">
                                <i data-lucide="x" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `;
        });
        html += `</tbody></table></div></div>`;

        const packingMap = new Map();
        const techByFinish = {};

        rows.forEach(r => {
            const pKey = `${safeVal(r[COLS.MEDIDA])}_${safeVal(r[COLS.ESPESOR])}`;
            if(!packingMap.has(pKey) && (hasValue(r[COLS.PZ_CAJA]) || hasValue(r[COLS.M2_PALLET]))) {
                packingMap.set(pKey, r);
            }
            
            let fin = safeVal(r[COLS.ACABADO_ART]) || 'GENÉRICO';
            const nombreArt = safeVal(r[COLS.NOMBRE]).toUpperCase();
            const espesorArt = safeVal(r[COLS.ESPESOR]).toUpperCase();

            if (espesorArt.startsWith('20') || espesorArt.includes('20MM')) fin = `${fin} [20MM]`;
            else if (nombreArt.includes('DUP')) fin = `${fin} [DUP]`;
            else if (nombreArt.includes('EXT')) fin = `${fin} [EXT]`;

            if(!techByFinish[fin]) techByFinish[fin] = { cte: new Set(), r: new Set(), din: new Set(), ptv: new Set() };
            if(hasValue(r[COLS.CLASE])) techByFinish[fin].cte.add(r[COLS.CLASE]);

            if(hasValue(r[COLS.LETRA])) techByFinish[fin].din.add(r[COLS.LETRA]);

        const packingList = Array.from(packingMap.values()).sort((a, b) => {

        html += `

                                    <td class="p-2">${safeVal(p[COLS.M2_PALLET]) || '-'}</td>
                                    <td class="p-2 font-bold">${safeVal(p[COLS.KG_PALLET]) || '-'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="panel p-6">
                <h4 class="font-bold text-gray-800 border-b border-gray-100 pb-3 mb-4 flex items-center gap-2 text-sm uppercase tracking-wide">
                    <i data-lucide="flask-conical" class="w-4 h-4 text-gray-400"></i> Resumen Técnico
                </h4>
                <div class="space-y-3 text-sm">
                    ${Object.keys(techByFinish).map(fin => {
                        const data = techByFinish[fin];
                        if(data.cte.size === 0 && data.r.size === 0 && data.din.size === 0 && data.ptv.size === 0) return '';
                        
                        return `
                        <div class="border border-gray-200 rounded-lg bg-gray-50 p-4 hover:shadow-sm transition-shadow">
                            <div class="font-bold text-gray-800 mb-2 border-b border-gray-200 pb-2 uppercase text-xs tracking-wider flex items-center gap-2">
                                <div class="w-2 h-2 rounded-full bg-blue-500"></div> ${fin}
                            </div>
                            <div class="grid grid-cols-2 gap-y-2 gap-x-6 font-tech text-xs">
                                ${data.cte.size ? `<div class="flex justify-between"><span class="text-gray-500">CTE:</span> <span class="font-bold text-gray-800">${Array.from(data.cte).join(', ')}</span></div>` : ''}
                                ${data.r.size ? `<div class="flex justify-between"><span class="text-gray-500">R:</span> <span class="font-bold text-gray-800">${Array.from(data.r).join(', ')}</span></div>` : ''}
                                ${data.din.size ? `<div class="flex justify-between"><span class="text-gray-500">DIN:</span> <span class="font-bold text-gray-800">${Array.from(data.din).join(', ')}</span></div>` : ''}
                                ${data.ptv.size ? `<div class="flex justify-between"><span class="text-gray-500">PTV:</span> <span class="font-bold text-gray-800">${Array.from(data.ptv).join(', ')}</span></div>` : ''}
                            </div>
                        </div>
                        `;
                    }).join('')}
                </div>
            </div>
        </div>
        `;

        container.innerHTML = html;
        if(window.lucide) lucide.createIcons();
    }

    // --- 6. ACCIONES ---
    window.setStatus = function(id, status, comment = '') {
        APP_STATE.auditResults[id] = { status, comment, date: new Date().toISOString() };
        localStorage.setItem('audit_results_v1', JSON.stringify(APP_STATE.auditResults));
        
        const row = document.getElementById(`row-${id}`);
        if(row) {
            row.className = (status === 'ok' ? 'row-ok' : 'row-error');
            const iconCell = row.querySelector('td:first-child i');
            
            if(status === 'ok') {
                iconCell.setAttribute('data-lucide', 'check-circle-2');
                iconCell.className = 'text-green-500 mx-auto w-5 h-5';
            } else {
                iconCell.setAttribute('data-lucide', 'alert-circle');
                iconCell.className = 'text-red-500 mx-auto w-5 h-5';
            }
            lucide.createIcons();
        }
        updateSidebarDot(id);
        updateGlobalProgress();
    }

    function updateSidebarDot(articleId) {
        const art = APP_STATE.data.find(a => a[COLS.ID] === articleId);
        if(art) {
            const item = document.querySelector(`.nav-item[data-serie="${art[COLS.SERIE].toLowerCase()}"][data-coll="${art[COLS.COLECCION].toLowerCase()}"]`);
            if(item) {
                const rows = APP_STATE.hierarchy[art[COLS.COLECCION]][art[COLS.SERIE]];
                let err=0, ok=0;
                rows.forEach(r => {
                    const s = APP_STATE.auditResults[r[COLS.ID]]?.status;
                    if(s==='error') err++;
                    if(s==='ok') ok++;
                });
                const existingDot = item.querySelector('.rounded-full');
                if(existingDot) existingDot.remove();
                
                let dotHTML = '';
                if(err > 0) dotHTML = `<div class="w-2 h-2 rounded-full bg-red-500 shadow-sm"></div>`;
                else if(ok === rows.length) dotHTML = `<div class="w-2 h-2 rounded-full bg-green-500 shadow-sm"></div>`;
                
                if(dotHTML) item.insertAdjacentHTML('beforeend', dotHTML);
            }
        }
    }

    window.reportError = function(id) {
        const comment = prompt("Describe el error encontrado:");
        if(comment !== null) setStatus(id, 'error', comment || 'Error genérico');
    }

    window.markAllOk = function() {
        if(!confirm("¿Validar TODOS los artículos de esta serie?")) return;
        const rows = APP_STATE.hierarchy[APP_STATE.currentSerie.coll][APP_STATE.currentSerie.name];
        rows.forEach(r => {
            APP_STATE.auditResults[r[COLS.ID]] = { status: 'ok', comment: '', date: new Date().toISOString() };
        });
        localStorage.setItem('audit_results_v1', JSON.stringify(APP_STATE.auditResults));
        loadSerieView(APP_STATE.currentSerie.name, APP_STATE.currentSerie.coll);
        if(rows.length > 0) updateSidebarDot(rows[0][COLS.ID]);
        updateGlobalProgress();
    }

    function updateGlobalProgress() {
        const total = APP_STATE.data.length;
        if(total === 0) return;
        const reviewed = Object.keys(APP_STATE.auditResults).length;
        const pct = Math.round((reviewed / total) * 100);
        document.getElementById('progress-bar').style.width = pct + '%';
        document.getElementById('progress-text').innerText = `${pct}%`;
    }

    document.getElementById('global-search').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase().trim();
        const nav = document.getElementById('nav-tree');
        
        if (term === '') {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('hidden-item'));
            document.querySelectorAll('.collection-group').forEach(g => g.style.display = '');
            return;
        }

        const groups = nav.querySelectorAll('.collection-group');
        groups.forEach(group => {
            let anyVisible = false;
            const items = group.querySelectorAll('.nav-item');
            const header = group.querySelector('.collection-header');
            const container = group.querySelector('.series-container');
            const icon = header.querySelector('.chevron-icon');
            const collName = group.dataset.coll;
            const collMatches = collName.includes(term);

            items.forEach(item => {
                const serieName = item.innerText.toLowerCase();
                const matches = serieName.includes(term) || collMatches;
                if (matches) {
                    item.classList.remove('hidden-item');
                    anyVisible = true;
                } else {
                    item.classList.add('hidden-item');
                }
            });

            if (anyVisible) {
                group.style.display = '';
                container.style.display = 'block';
                container.classList.add('expanded');
                icon.classList.add('rotated');
            } else {
                group.style.display = 'none';
            }
        });
    });

    document.getElementById('btn-export-errors').addEventListener('click', () => {
        const errors = [];
        for(const [id, res] of Object.entries(APP_STATE.auditResults)) {
            if(res.status === 'error') {
                const item = APP_STATE.data.find(r => r[COLS.ID] === id) || {};
                errors.push({
                    ID: id,
                    Coleccion: item[COLS.COLECCION],
                    Serie: item[COLS.SERIE],
                    Modelo: item[COLS.NOMBRE],
                    Error: res.comment,
                    Fecha: res.date
                });
            }
        }
        if(errors.length === 0) {
            alert("¡Buen trabajo! No hay errores registrados.");
            return;
        }
        const csv = Papa.unparse(errors, { delimiter: ";" });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", "errores_auditoria_" + new Date().toISOString().slice(0,10) + ".csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });
    </script>
</body>
</html>
